apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-forgejo-access
  namespace: auth-keycloak
spec:
  releaseName: auth-keycloak-forgejo-access
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: keycloak-realm-roles
      namespace: auth-keycloak
  chart:
    spec:
      chart: ./charts/keycloak/addon-access
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: keycloak-product-values
      valuesKey: values.yaml
  values:
    k8sTools:
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
    addonAccess:
      enabled: true
      name: forgejo
      realmRoles: [forgejo-user, forgejo-admin]
      realmRoleComposites:
        forgejo-admin: [forgejo-user]
      accessGroups:
        /access/neurwerk-forgejo-admins:
          realmRoles: [forgejo-admin]
        /access/neurwerk-forgejo-users:
          realmRoles: [forgejo-user]
      platformAdminRole: forgejo-admin
      platformAdminGrant: true
