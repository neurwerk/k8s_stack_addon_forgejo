apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-external-secrets
  namespace: forgejo
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["forgejo-external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-external-secrets
  namespace: forgejo
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: forgejo-external-secrets}
subjects:
  - kind: ServiceAccount
    name: infra-external-secrets
    namespace: infra-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-external-secrets
  namespace: forgejo
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: forgejo-openbao-secret-store
  namespace: forgejo
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: addon-forgejo-runtime
          serviceAccountRef:
            name: forgejo-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runtime
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: forgejo-openbao-secret-store
    kind: SecretStore
  target:
    name: forgejo-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: dbPassword
      remoteRef:
        key: addons/forgejo/database
        property: dbPassword
    - secretKey: oidcClientSecret
      remoteRef:
        key: addons/forgejo/oidc
        property: oidcClientSecret
    - secretKey: secretKey
      remoteRef:
        key: addons/forgejo/runtime
        property: secretKey
    - secretKey: internalToken
      remoteRef:
        key: addons/forgejo/runtime
        property: internalToken
    - secretKey: oauth2JwtSecret
      remoteRef:
        key: addons/forgejo/runtime
        property: oauth2JwtSecret
    - secretKey: lfsJwtSecret
      remoteRef:
        key: addons/forgejo/runtime
        property: lfsJwtSecret
    - secretKey: adminPassword
      remoteRef:
        key: addons/forgejo/admin
        property: adminPassword
