apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-certificate-approval
  namespace: infra-cert-manager
spec:
  interval: 5m
  timeout: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: cert-manager-approver-policy
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/forgejo/certificate-approval
      sourceRef:
        kind: GitRepository
        name: forgejo-addon
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
