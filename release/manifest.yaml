apiVersion: addons.neurwerk.com/v1alpha2
kind: AddonRelease
metadata:
  name: forgejo
spec:
  version: 0.1.0
  status: ready
  sourceName: forgejo-addon
  configurationKey: forgejo
  inputs:
    - {kind: ConfigMap, namespace: auth-keycloak, name: client-values, owner: client}
    - {kind: ConfigMap, namespace: auth-keycloak, name: keycloak-product-values, owner: client}
    - {kind: ConfigMap, namespace: auth-keycloak, name: forgejo-oidc-settings, owner: client}
    - {kind: ConfigMap, namespace: auth-keycloak, name: forgejo-oidc-approval-values, owner: client}
    - {kind: Secret, namespace: auth-keycloak, name: auth-keycloak-secret, owner: base}
    - {kind: ConfigMap, namespace: forgejo, name: client-values, owner: client}
    - {kind: ConfigMap, namespace: forgejo, name: forgejo-product-values, owner: client}
    - {kind: ConfigMap, namespace: infra-cert-manager, name: client-values, owner: client}
  prerequisites:
    base: 0.3.34
    tooling: 0.18.3
    stackSetup: 0.8.6
    baseCharts:
      - charts/postgres/addon
      - charts/keycloak/addon-access
      - charts/keycloak/addon-oidc
    baseChartVersions:
      charts/postgres/addon: 0.1.3
      charts/keycloak/addon-access: 0.1.7
      charts/keycloak/addon-oidc: 0.2.2
  packages:
    - name: namespaces
      path: releases/namespaces/forgejo
    - name: secret-sync
      path: releases/forgejo/secret-sync
      dependsOn: [namespaces]
    - name: database
      path: releases/forgejo/database
      dependsOn: [secret-sync]
    - name: access
      path: releases/forgejo/access
      dependsOn: [secret-sync]
    - name: oidc
      path: releases/forgejo/oidc
      dependsOn: [access, secret-sync]
    - name: certificate-approval
      path: releases/forgejo/certificate-approval
      dependsOn: [namespaces]
    - name: app
      path: releases/forgejo/app
      dependsOn: [database, oidc, certificate-approval]
  retention:
    databases: retain
    volumes: retain
    credentials: retain
  databases:
    - id: database
      service: {namespace: infra-postgres-operations, name: postgres-operations}
      engine: postgresql
      database: forgejo
      role: forgejo
      owner: forgejo
      package: database
      baseChart: charts/postgres/addon
  artifacts:
    - id: tooling
      role: product
      image: ghcr.io/neurwerk/k8s-stack-addon-forgejo-tooling:0.1.0@sha256:bdc194f05f00b4c92d06dda3999a01f07f23cd59557b48a87ad47929774739ac
    - id: native
      role: native
      image: code.forgejo.org/forgejo/forgejo:15.0.8-rootless@sha256:8f97b55ca162ef3b538c6c78a2a077df9f2143c41d80b2bc6b6920f8d430df34
    - id: access-provisioner
      role: shared
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
    - id: oidc-provisioner
      role: shared
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
    - id: database-provisioner
      role: native
      image: ghcr.io/documentdb/documentdb/documentdb-local:pg18-0.116.0@sha256:01bb9408393fb6417cc32735f4566dee4b53bbab6df6b70c42797317da631f12
  consumers:
    - {artifact: tooling, kind: Command, argv: [forgejo-validate, /work/addon]}
    - artifact: tooling
      package: app
      kind: HelmRelease
      namespace: forgejo
      name: forgejo
      container: stage-bootstrap
      location: initContainers
    - artifact: native
      package: app
      kind: HelmRelease
      namespace: forgejo
      name: forgejo
      container: bootstrap
      location: initContainers
    - artifact: native
      package: app
      kind: HelmRelease
      namespace: forgejo
      name: forgejo
      container: forgejo
    - artifact: access-provisioner
      package: access
      kind: HelmRelease
      namespace: auth-keycloak
      name: keycloak-forgejo-access
      container: reconcile
    - artifact: oidc-provisioner
      package: oidc
      kind: HelmRelease
      namespace: auth-keycloak
      name: keycloak-forgejo-oidc
      container: configure
    - artifact: database-provisioner
      package: database
      kind: HelmRelease
      namespace: infra-postgres-operations
      name: forgejo-postgres
      container: provision
  nativeOutputs:
    - id: internal-token
      artifact: native
      argv: [/app/gitea/gitea, generate, secret, INTERNAL_TOKEN]
      idleArgv: [/bin/sleep, '300']
      outputKey: internalToken
      transport: private-exec-text
      timeoutSeconds: 60
      maxBytes: 4096
      validation: {format: jwt-hs256-nbf, minLength: 80, maxLength: 4096}
  identities:
    - id: browser
      mode: browser
      clientId: forgejo
      secret: {record: oidc, field: oidcClientSecret}
      browserSettings:
        namespace: auth-keycloak
        settings: forgejo-oidc-settings
        approval: forgejo-oidc-approval-values
  setup:
    records:
      - id: database
        path: addons/forgejo/database
        fields:
          dbPassword:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
      - id: oidc
        path: addons/forgejo/oidc
        fields:
          oidcClientSecret:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
      - id: runtime
        path: addons/forgejo/runtime
        fields:
          secretKey:
            generate: {encoding: hex, bytes: 32}
            validation: {format: hex, minLength: 64, maxLength: 64}
          internalToken:
            preparedOutput: internal-token
            validation: {format: jwt-hs256-nbf, minLength: 80, maxLength: 4096}
          oauth2JwtSecret:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
          lfsJwtSecret:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
      - id: admin
        path: addons/forgejo/admin
        fields:
          adminPassword:
            generate: {encoding: base64url, bytes: 32}
            validation: {format: base64url, minLength: 43, maxLength: 43}
    readers:
      - role: addon-forgejo-runtime
        namespace: forgejo
        serviceAccount: forgejo-external-secrets
        audience: openbao
        records: [database, oidc, runtime, admin]
      - role: infra-postgres-operations
        namespace: infra-postgres-operations
        serviceAccount: infra-postgres-operations-external-secrets
        audience: openbao
        records: [database]
      - role: auth-keycloak
        namespace: auth-keycloak
        serviceAccount: auth-keycloak-external-secrets
        audience: openbao
        records: [oidc]
    deliveries:
      - namespace: infra-postgres-operations
        name: forgejo-postgres-password
        secretStore: infra-postgres-operations-openbao-secret-store
        targetSecret: forgejo-postgres-password
        records: [database]
      - namespace: auth-keycloak
        name: forgejo-oidc-values
        secretStore: auth-keycloak-openbao-secret-store
        targetSecret: forgejo-oidc-values
        records: [oidc]
      - namespace: forgejo
        name: forgejo-runtime
        secretStore: forgejo-openbao-secret-store
        targetSecret: forgejo-runtime
        records: [database, oidc, runtime, admin]
    handover:
      - id: recovery-admin
        label: Forgejo recovery administrator (forgejo-recovery)
        value: {record: admin, field: adminPassword}
