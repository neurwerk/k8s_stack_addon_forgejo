# Platform integration supplies namespace, credentials, database and OIDC client.
forgejoTooling:
  image: ghcr.io/neurwerk/k8s-stack-addon-forgejo-tooling:0.1.0@sha256:bdc194f05f00b4c92d06dda3999a01f07f23cd59557b48a87ad47929774739ac
forgejo:
  enabled: false
  # The single canonical browser, TLS and clone hostname. Required when enabled.
  hostname: ""
  # Emergency only: temporarily permits native password login, not registration.
  recoveryLoginEnabled: false
  oidc:
    # Optional namespace-local public CA ConfigMap, key ca.crt. Empty uses system roots.
    # Staging/private Keycloak certificates require an independently verified CA bundle.
    caConfigMap: ""
  persistence:
    storageClass: infra-rook-ceph-rbd
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  networkPolicy:
    # Operations PostgreSQL's container port differs from its Service port 5432.
    postgresPodPort: 9712
    postgresPodSelector:
      app.kubernetes.io/name: postgres-operations
    # Explicit namespace + Pod peers for internal HTTPS/SSH service consumers.
    clients: []
    # Private native HTTPS only (Service 443 -> Pod 3000), never SSH.
    # Exact namespace + nonempty Pod selectors; incompatible with the public Gateway.
    httpsClients: []
    # public-dns requires exact reviewed Keycloak destination /32 or /128 CIDRs.
    keycloakPublicCidrs: []
authKeycloak:
  hostname: ""
  realm: ""
canonicalEndpointRouting:
  mode: internal-traefik
externalGateway:
  enabled: false
  port: 443
publicCertificates:
  useProduction: false
