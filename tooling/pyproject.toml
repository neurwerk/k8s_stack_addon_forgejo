[project]
name = "forgejo-tooling"
version = "0.1.0"
description = "Forgejo definitions and native bootstrap payload"
requires-python = ">=3.12"
dependencies = ["k8s-stack-tooling==0.18.3"]

[tool.uv.sources]
k8s-stack-tooling = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/v0.18.3/k8s_stack_tooling-0.18.3-py3-none-any.whl"}
openbao-stack-setup = {url = "https://github.com/neurwerk/k8s_stack_tooling/releases/download/stack-setup-v0.8.6/openbao_stack_setup-0.8.6-py3-none-any.whl"}

[project.scripts]
forgejo-validate = "forgejo_tooling.cli:main"
forgejo-stage-bootstrap = "forgejo_tooling.cli:stage_bootstrap"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "PyYAML>=6.0,<7", "ruff>=0.15.17", "ty>=0.0.49", "openbao-stack-setup==0.8.6"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["forgejo_tooling"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
